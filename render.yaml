services:
  # ─── App Next.js ─────────────────────────────────────────────────────────────
  - type: web
    name: tennis-hub-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tennis-hub-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false   # preencher com a URL do Render após deploy
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false   # preencher com sua chave Resend
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

  # ─── Scraper FPT (Cron Job) ───────────────────────────────────────────────────
  - type: cron
    name: tennis-hub-scraper-fpt
    runtime: docker
    dockerfilePath: ./packages/connectors/fpt/Dockerfile
    dockerContext: ./packages/connectors/fpt
    schedule: "0 */6 * * *"    # a cada 6 horas
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          name: tennis-hub-web
          type: web
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: INTERNAL_SECRET
        fromService:
          name: tennis-hub-web
          type: web
          envVarKey: INTERNAL_SECRET
      - key: SCRAPER_HEADLESS
        value: "true"

  # ─── Scraper CBT (Cron Job) ───────────────────────────────────────────────────
  - type: cron
    name: tennis-hub-scraper-cbt
    runtime: docker
    dockerfilePath: ./packages/connectors/cbt/Dockerfile
    dockerContext: ./packages/connectors/cbt
    schedule: "30 */6 * * *"   # a cada 6 horas, 30min depois do FPT
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          name: tennis-hub-web
          type: web
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: INTERNAL_SECRET
        fromService:
          name: tennis-hub-web
          type: web
          envVarKey: INTERNAL_SECRET
      - key: SCRAPER_HEADLESS
        value: "true"

  # ─── Alert Dispatcher (Cron Job) ─────────────────────────────────────────────
  - type: cron
    name: tennis-hub-alerts
    runtime: node
    buildCommand: npm install && cd packages/jobs && npm install
    startCommand: cd packages/jobs && npx tsx alert-dispatcher.ts
    schedule: "0 * * * *"    # a cada hora
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tennis-hub-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: tennis-hub-db
    plan: free
    databaseName: tennishub
    user: tennishub
